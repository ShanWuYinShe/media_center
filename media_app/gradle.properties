android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Gradle 配置缓存:首次 build 后缓存 task graph,后续构建复用(可以显著加速)。
# 启用后,gradle.properties / build.gradle.kts 变更时缓存自动失效,无需手动 clean。
org.gradle.configuration-cache=true
# AGP 9.2 推荐:用 useConstraints=false 替代旧的
# `dependency.excludeLibraryComponentsFromConstraints=true`(已 deprecated)。
# 见 AGP 警告 "Following can be set instead to achieve a similar behaviour."
android.dependency.useConstraints=false
# R8 strict full mode 为 AGP 默认:keep 规则按 full mode 语义书写
# (proguard-rules.pro),不再回退非严格模式。
# AGP 内部使用了已废弃的 Gradle API，以 summary 粒度展示而非完全压制
org.gradle.warning.mode=summary
android.uniquePackageNames=false
