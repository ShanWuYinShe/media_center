name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  media-server:
    name: Media Server (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Go 版本需与 media_server/Dockerfile 的 GO_VERSION、deploy/versions.env 保持一致
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          cache: true
          cache-dependency-path: media_server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l media_server/)"
      - name: go vet
        run: go vet ./...
        working-directory: media_server
      - name: go build
        run: go build -o /dev/null .
        working-directory: media_server
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: media_server

  vod-extractor:
    name: VOD Extractor (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # 与 deploy/versions.env 的 PYTHON_VERSION 保持一致
          python-version: '3.14.7'

      - name: syntax check
        run: python3 -m py_compile vod_extractor/server.py
      - name: ruff
        run: |
          # 钉版本:规则集虽锁 E4/E7/E9/F,新 ruff 仍可能在这些组内加规则导致结果漂移
          python3 -m pip install "ruff==0.16.8"
          ruff check vod_extractor
      - name: unit tests
        run: python3 -m unittest discover -s vod_extractor/tests -v

  media-app:
    name: Media App (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # JDK 17 与 media_app build.gradle.kts 的 sourceCompatibility/jvmTarget 一致；
      # setup-java 版本以 repos/actions/setup-java 最新 release 为准（当前 v6.0.1）
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Android SDK 用 ubuntu runner 自带安装（/usr/local/lib/android/sdk），不额外装 action
      - name: assembleDebug
        working-directory: media_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: unit tests
        working-directory: media_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # legacy 存档变体此前只在发版脚本（scripts/release-apk.sh）里编译，
      # 编译破坏要到发版才发现，这里做低成本兜底（debug 变体，无 R8）。
      - name: legacy assembleDebug
        working-directory: media_app_legacy
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleDebug --no-daemon
