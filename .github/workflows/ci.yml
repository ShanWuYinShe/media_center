name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  media-server:
    name: Media Server (Go)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Go 版本需与 media_server/Dockerfile 的 GO_VERSION、deploy/versions.env 保持一致
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: media_server/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l media_server/)"
      - name: go vet
        run: go vet ./...
        working-directory: media_server
      - name: go build
        run: go build -o /dev/null .
        working-directory: media_server
      - name: go test
        run: go test -race -count=1 ./...
        working-directory: media_server

  vod-extractor:
    name: VOD Extractor (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          # 与 deploy/versions.env 的 PYTHON_VERSION 保持一致
          python-version: '3.14.7'

      - name: syntax check
        run: python3 -m py_compile vod_extractor/server.py
      - name: ruff
        run: |
          # 钉版本:规则集虽锁 E4/E7/E9/F,新 ruff 仍可能在这些组内加规则导致结果漂移
          python3 -m pip install "ruff==0.16.8"
          ruff check vod_extractor
      - name: unit tests
        run: python3 -m unittest discover -s vod_extractor/tests -v

  media-app:
    name: Media App (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # JDK 17 与 media_app build.gradle.kts 的 sourceCompatibility/jvmTarget 一致；
      # setup-java 版本以 repos/actions/setup-java 最新 release 为准（当前 v6.0.1）
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Android SDK 用 ubuntu runner 自带安装（/usr/local/lib/android/sdk），不额外装 action。
      #
      # normal 与 legacy 都编译 debug + release：release 走 R8 + 资源压缩，能把
      # proguard/keep 规则、资源裁剪这类只在发布构建暴露的问题提前到 PR 阶段；
      # 任务与 .github/workflows/release-app.yml 一致，避免「CI 绿、发版红」。
      - name: assembleDebug + assembleRelease (normal)
        working-directory: media_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: unit tests
        working-directory: media_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Android Lint:此前完全未在 CI 跑,UnsafeOptInUsageError 之外的
      # 新问题(未使用资源、API 版本误用、manifest 权限等)只能靠人眼发现。
      # lint.xml 已声明项目级 opt-in 选项,直接跑即可。
      - name: lint
        working-directory: media_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:lintDebug --no-daemon

      # legacy 存档变体：debug + release 都编译。此前只编 debug，R8/keep 规则问题
      # 要到发版才暴露；release 已配 debug 签名，可直接构建。
      - name: assembleDebug + assembleRelease (legacy)
        working-directory: media_app_legacy
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      # CI 构建的 release APK 仅用于 TV 真机 UI 走查：未注入 APP_API_TOKEN
      # （YouTube 实时通道不可用），签名也是每次构建随机生成的 debug 密钥。
      - name: Collect CI APKs for TV walkthrough
        run: |
          set -euo pipefail
          mkdir -p ci-apks
          cp media_app/app/build/outputs/apk/release/app-release.apk ci-apks/media-app-normal-ci.apk
          cp media_app_legacy/app/build/outputs/apk/release/app-release.apk ci-apks/media-app-legacy-ci.apk
          # baseline-profile 规则生成用:保留 R8 混淆映射,便于把运行期/静态方法
          # 还原为源码签名(也用于崩溃栈还原)。
          cp media_app/app/build/outputs/mapping/release/mapping.txt ci-apks/mapping.txt
          cat > ci-apks/README.txt <<'EOF'
          仅用于 TV 真机 UI 走查的 CI 构建产物。
          - 未注入 APP_API_TOKEN（YouTube 实时通道不可用）；
          - 使用 CI 临时 debug 签名，不可用于发布或应用内升级；
          - 正式发版由 .github/workflows/release-app.yml 在 tag 上构建。
          EOF

      - name: Upload CI APKs
        uses: actions/upload-artifact@v4
        with:
          name: ci-apks-${{ github.run_id }}
          path: ci-apks/
          retention-days: 7
